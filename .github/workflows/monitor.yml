name: Monitor bandi MUR

on:
  schedule:
    # Orari in UTC: 06:00 e 15:00 UTC = 8:00 e 17:00 ora legale italiana (7:00 e 16:00 d'inverno)
    - cron: "0 6,15 * * *"
  workflow_dispatch: # permette di lanciarlo a mano dalla scheda "Actions"

permissions:
  contents: write # serve per salvare seen.json nel repository

concurrency:
  group: monitor-bandi
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla i nuovi bandi
        env:
          GMAIL_INDIRIZZO: ${{ secrets.GMAIL_INDIRIZZO }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
          DESTINATARI: ${{ secrets.DESTINATARI }}
          PAGE_URL: ${{ vars.PAGE_URL }}
        run: python monitor.py

      - name: Salva bandi visti, stato e pagina web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json stato.json
          if [ -d docs ]; then git add docs; fi
          git diff --cached --quiet || git commit -m "Aggiorna bandi visti"
          git push
